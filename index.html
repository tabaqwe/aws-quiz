<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CLF-C02 Daily Quiz</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#1d2330;--muted:#667085;--line:#e3e6eb;--accent:#d97706;--ok:#15803d;--okbg:#e8f6ec;--bad:#b42318;--badbg:#fdecea;--sel:#fff4e0}
@media (prefers-color-scheme:dark){:root{--bg:#12151b;--card:#1b1f27;--fg:#e6e8ec;--muted:#98a2b3;--line:#2c323d;--accent:#f59e0b;--ok:#4ade80;--okbg:#14301f;--bad:#f87171;--badbg:#3a1a1a;--sel:#2e2412}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:24px 16px 64px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:20px}
h1{font-size:1.25rem;margin:0}
select,button{font:inherit;color:inherit}
select{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:.85rem;margin-bottom:8px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:18px}
.bar>i{display:block;height:100%;background:var(--accent);transition:width .25s}
.q{font-weight:600;margin:0 0 6px}
.multi{color:var(--muted);font-size:.85rem;margin-bottom:12px}
.opt{display:flex;gap:10px;width:100%;text-align:left;background:transparent;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.sel{background:var(--sel);border-color:var(--accent)}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad)}
.opt:disabled{cursor:default}
.opt b{min-width:1.4em}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 14px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.note{margin-top:14px;padding:12px;border-radius:10px;border:1px solid var(--line);font-size:.95rem}
.note.hint{border-style:dashed;color:var(--muted)}
.note.ok{border-color:var(--ok)}.note.bad{border-color:var(--bad)}
.score{font-size:2rem;font-weight:700;margin:0}
.rev{border-top:1px solid var(--line);padding:12px 0}
.rev small{color:var(--muted)}
.tag{display:inline-block;font-size:.75rem;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.err{color:var(--bad)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>CLF-C02 Daily Quiz</h1>
    <select id="day" aria-label="Choose quiz date"></select>
  </header>
  <div class="card" id="app">Loading…</div>
</div>
<script>
const L = 'ABCDE';
const app = document.getElementById('app'), daySel = document.getElementById('day');
let quiz, i, picks, results, hintShown;

const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const same = (a,b) => a.length===b.length && a.every(x=>b.includes(x));

async function init(){
  try{
    const days = (await (await fetch('quizzes/index.json',{cache:'no-store'})).json()).sort().reverse();
    daySel.innerHTML = days.map(d=>{
      const s = store.get('score:'+d);
      return `<option value="${d}">${d}${s?` — ${s.score}/${s.total}`:''}</option>`;
    }).join('');
    const want = new URLSearchParams(location.search).get('date');
    if (want && days.includes(want)) daySel.value = want;
    daySel.onchange = () => load(daySel.value);
    load(daySel.value);
  }catch(e){
    app.innerHTML = `<p class="err">Couldn't load quizzes/index.json.</p><p>Open this page over HTTP (GitHub Pages, or run <code>python3 -m http.server</code> in the repo folder). Browsers block fetch() from file:// URLs.</p>`;
  }
}

async function load(d){
  app.textContent = 'Loading…';
  quiz = await (await fetch(`quizzes/${d}.json`,{cache:'no-store'})).json();
  i = 0; results = []; start();
}
function start(){ picks = []; hintShown = false; render(); }

function render(){
  const q = quiz.questions[i], n = quiz.questions.length, done = results[i];
  const multi = q.answer.length > 1;
  app.innerHTML = `
    <div class="meta"><span>Question ${i+1} / ${n}</span><span class="tag">${esc(q.domain||'')}</span></div>
    <div class="bar"><i style="width:${(i/n)*100}%"></i></div>
    <p class="q">${esc(q.q)}</p>
    ${multi?`<div class="multi">Choose ${q.answer.length}.</div>`:''}
    <div>${q.options.map((o,k)=>{
      let c = '';
      if (done){ if (q.answer.includes(k)) c='ok'; else if (done.picks.includes(k)) c='bad'; }
      else if (picks.includes(k)) c='sel';
      return `<button class="opt ${c}" data-k="${k}" ${done?'disabled':''}><b>${L[k]}.</b><span>${esc(o)}</span></button>`;
    }).join('')}</div>
    ${hintShown && !done ? `<div class="note hint">💡 ${esc(q.hint)}</div>`:''}
    ${done ? `<div class="note ${done.ok?'ok':'bad'}"><strong>${done.ok?'Correct.':'Not quite. Answer: '+q.answer.map(a=>L[a]).join(', ')+'.'}</strong> ${esc(q.explanation)}</div>`:''}
    <div class="row">
      ${done
        ? `<button class="btn primary" id="next">${i+1<n?'Next question':'See results'}</button>`
        : `<button class="btn primary" id="check" ${picks.length===q.answer.length?'':'disabled'}>Check answer</button>
           <button class="btn" id="hint" ${hintShown||!q.hint?'disabled':''}>Hint</button>`}
    </div>`;
  app.querySelectorAll('.opt:not(:disabled)').forEach(b => b.onclick = () => {
    const k = +b.dataset.k;
    if (multi){ picks = picks.includes(k) ? picks.filter(x=>x!==k) : (picks.length<q.answer.length ? [...picks,k] : picks); }
    else picks = [k];
    render();
  });
  const $ = id => document.getElementById(id);
  if ($('hint')) $('hint').onclick = () => { hintShown = true; render(); };
  if ($('check')) $('check').onclick = () => { results[i] = {picks, ok: same(picks,q.answer), hint: hintShown}; render(); };
  if ($('next')) $('next').onclick = () => { if (++i < n) start(); else summary(); };
}

function summary(){
  const n = quiz.questions.length, score = results.filter(r=>r.ok).length;
  const prev = store.get('score:'+quiz.date);
  if (!prev || score >= prev.score) store.set('score:'+quiz.date, {score, total:n});
  const opt = daySel.querySelector(`option[value="${quiz.date}"]`);
  if (opt) opt.textContent = `${quiz.date} — ${Math.max(score, prev?prev.score:0)}/${n}`;
  const byDomain = {};
  quiz.questions.forEach((q,k)=>{ const d=q.domain||'Other'; byDomain[d]=byDomain[d]||[0,0]; byDomain[d][1]++; if(results[k].ok) byDomain[d][0]++; });
  app.innerHTML = `
    <p class="score">${score} / ${n}</p>
    <p style="color:var(--muted);margin-top:4px">${score>=7?'Above the ~70% passing bar.':'Below the ~70% passing bar (700/1000 scaled). Review the misses below.'}</p>
    <p>${Object.entries(byDomain).map(([d,[a,t]])=>`<span class="tag">${esc(d)}: ${a}/${t}</span>`).join(' ')}</p>
    ${quiz.questions.map((q,k)=>{ const r = results[k]; return `
      <div class="rev"><div>${r.ok?'✅':'❌'} <strong>${k+1}.</strong> ${esc(q.q)}</div>
      <small>Your answer: ${r.picks.map(p=>L[p]).join(', ')} · Correct: ${q.answer.map(a=>L[a]+'. '+esc(q.options[a])).join('; ')}${r.hint?' · used hint':''}</small>
      ${r.ok?'':`<div style="margin-top:6px;font-size:.95rem">${esc(q.explanation)}</div>`}</div>`; }).join('')}
    <div class="row"><button class="btn primary" id="retry">Retry this quiz</button></div>`;
  document.getElementById('retry').onclick = () => { i = 0; results = []; start(); };
}
init();
</script>
</body>
</html>
