name: Record quiz results

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: quiz-results
  cancel-in-progress: false

jobs:
  record:
    # Only the repo owner's own result issues
    if: startsWith(github.event.issue.title, 'Quiz results:') && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update mistakes.json
        id: rec
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: python3 .github/scripts/record_results.py

      - name: Commit
        run: |
          git config user.name "${{ github.repository_owner }}"
          git config user.email "${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com"
          git add courses/*/mistakes.json courses/*/stats.json
          git diff --cached --quiet && exit 0
          git commit -m "results: ${{ steps.rec.outputs.course }} ${{ steps.rec.outputs.quiz }} (${{ steps.rec.outputs.score }})"
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done; exit 1

      - name: Comment and close
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body-file summary.md
          gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }}
